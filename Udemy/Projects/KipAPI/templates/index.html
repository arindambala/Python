<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RESTful</title>

    {{ bootstrap.load_css() }}
</head>

<body class="container text-center mt-5">
    <h1 class="mb-4">Welcome to Cafe & Wi-Fi API</h1>

    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="{{ url_for('cafe') }}" class="btn btn-primary btn-lg px-4 gap-3" target="_blank">Get Random Cafe</a>
        <a href="{{ url_for('cafes') }}" class="btn btn-primary btn-lg px-4 gap-3" target="_blank">List of Cafes</a>
    </div>

    <form action="{{ url_for('loc') }}" method="GET"
        class="d-grid gap-3 d-sm-flex justify-content-sm-center align-items-center mt-3">
        <input type="text" name="loc" class="form-control form-control-lg w-auto"
            placeholder="Enter location (e.g. London)" required>
        <button type="submit" class="btn btn-success btn-lg px-4">Search a Cafe</button>
    </form>

    {{ bootstrap.load_js() }}
</body>

</html>
