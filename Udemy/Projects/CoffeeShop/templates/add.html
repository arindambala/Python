{% extends 'base.html' %}
{% from 'bootstrap5/form.html' import render_form %}
{% block title %}Add A New Cafe{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="mb-4">Add a new cafe to the database</h1>

            <div class="card bg-dark text-white p-4 shadow-sm border-secondary">
                {{ render_form(form, novalidate=True) }}
            </div>

            <div class="mt-4">
                <a href="{{ url_for('cafes') }}" class="link-warning">See all cafes ➡</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
